<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchMate</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e8eaf0;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
  .subtitle { font-size: 0.85rem; color: #6b7280; margin-bottom: 1.5rem; }
  textarea {
    width: 100%;
    height: 200px;
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 8px;
    color: #e8eaf0;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    padding: 0.875rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: #5b6af0; }
  textarea::placeholder { color: #3d4263; }
  button {
    margin-top: 0.75rem;
    background: #5b6af0;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 0.6rem 1.4rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  button:hover { background: #4a59df; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #cards { margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; }
  .card {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
  }
  .card-headline {
    font-weight: 700;
    font-size: 0.95rem;
    line-height: 1.4;
    margin-bottom: 0.6rem;
  }
  .card-summary {
    font-size: 0.875rem;
    line-height: 1.65;
    color: #c5c9d8;
  }
  .card-url {
    display: inline-block;
    margin-top: 0.65rem;
    font-size: 0.75rem;
    color: #5b6af0;
    text-decoration: none;
    word-break: break-all;
  }
  .card-url:hover { text-decoration: underline; }
  .skeleton .card-summary {
    background: linear-gradient(90deg, #2d3148 25%, #373d60 50%, #2d3148 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
    height: 4.5rem;
    color: transparent;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .error-msg { color: #f87171; font-size: 0.85rem; font-style: italic; }
  #parse-error { color: #f87171; font-size: 0.8rem; margin-top: 0.4rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="container">
  <h1>PitchMate</h1>
  <p class="subtitle">Paste your pitches, get radio-ready summaries.</p>
  <textarea id="input" placeholder="Morning Show Ratings Drop 20%
https://example.com/story1

Cat Elected Mayor of Small Ohio Town
https://example.com/story2"></textarea>
  <div id="parse-error"></div>
  <button id="btn">Summarise</button>
  <div id="cards"></div>
</div>

<script>
function parsePitches(text) {
  const blocks = text.trim().split(/\n{2,}/);
  const pairs = [];
  for (const block of blocks) {
    const lines = block.trim().split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) continue;
    const urlLine = lines.findIndex(l => /^https?:\/\//i.test(l));
    if (urlLine < 1) continue;
    const headline = lines.slice(0, urlLine).join(' ');
    const url = lines[urlLine];
    pairs.push({ headline, url });
  }
  return pairs;
}

function makeCard(headline, url, state) {
  const card = document.createElement('div');
  card.className = 'card' + (state === 'loading' ? ' skeleton' : '');
  card.innerHTML = `
    <div class="card-headline">${escHtml(headline)}</div>
    <div class="card-summary">${
      state === 'loading' ? '&nbsp;' :
      state === 'error' ? '<span class="error-msg">Couldn\'t read — likely paywalled.</span>' :
      escHtml(state)
    }</div>
    <a class="card-url" href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(url)}</a>
  `;
  return card;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('btn').addEventListener('click', async () => {
  const text = document.getElementById('input').value;
  const parseError = document.getElementById('parse-error');
  const pairs = parsePitches(text);

  if (pairs.length === 0) {
    parseError.textContent = 'No valid headline/URL pairs found. Make sure each pair is separated by a blank line.';
    return;
  }
  parseError.textContent = '';

  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Working…';

  const container = document.getElementById('cards');
  container.innerHTML = '';

  const cardEls = pairs.map(({ headline, url }) => {
    const el = makeCard(headline, url, 'loading');
    container.appendChild(el);
    return el;
  });

  try {
    const res = await fetch('/summarise', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pairs }),
    });
    const data = await res.json();

    data.results.forEach(({ headline, url, summary, error }, i) => {
      const el = cardEls[i];
      el.className = 'card';
      el.querySelector('.card-summary').innerHTML =
        error || !summary
          ? '<span class="error-msg">Couldn\'t read — likely paywalled.</span>'
          : escHtml(summary);
    });
  } catch {
    cardEls.forEach(el => {
      el.className = 'card';
      el.querySelector('.card-summary').innerHTML = '<span class="error-msg">Request failed — check your connection.</span>';
    });
  }

  btn.disabled = false;
  btn.textContent = 'Summarise';
});
</script>
</body>
</html>
