<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchMate</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root[data-theme="dark"] {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --border:    #2d3148;
    --border-focus: #5b6af0;
    --text:      #e8eaf0;
    --text-muted:#c5c9d8;
    --text-dim:  #6b7280;
    --placeholder:#3d4263;
    --accent:    #5b6af0;
    --accent-hover:#4a59df;
    --shimmer-a: #2d3148;
    --shimmer-b: #373d60;
    --error:     #f87171;
    --toggle-bg: #2d3148;
    --toggle-icon: '☀️';
  }
  :root[data-theme="light"] {
    --bg:        #f5f6fa;
    --surface:   #ffffff;
    --border:    #d1d5db;
    --border-focus: #5b6af0;
    --text:      #111827;
    --text-muted:#374151;
    --text-dim:  #6b7280;
    --placeholder:#9ca3af;
    --accent:    #4f46e5;
    --accent-hover:#4338ca;
    --shimmer-a: #e5e7eb;
    --shimmer-b: #d1d5db;
    --error:     #dc2626;
    --toggle-bg: #e5e7eb;
    --toggle-icon: '🌙';
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
    transition: background 0.2s, color 0.2s;
  }
  .container { max-width: 760px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .header-left h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
  }
  .header-left .subtitle { font-size: 0.85rem; color: var(--text-dim); }

  #theme-toggle {
    margin-top: 0;
    background: var(--toggle-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #theme-toggle:hover { border-color: var(--accent); }

  textarea {
    width: 100%;
    height: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    padding: 0.875rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s, background 0.2s, color 0.2s;
  }
  textarea:focus { border-color: var(--border-focus); }
  textarea::placeholder { color: var(--placeholder); }

  #summarise-btn {
    margin-top: 0.75rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 0.6rem 1.4rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  #summarise-btn:hover { background: var(--accent-hover); }
  #summarise-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #cards { margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    transition: background 0.2s, border-color 0.2s;
  }
  .card-headline {
    font-weight: 700;
    font-size: 0.95rem;
    line-height: 1.4;
    margin-bottom: 0.65rem;
  }
  .card-summary { font-size: 0.875rem; line-height: 1.65; color: var(--text-muted); }
  .card-summary ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .card-summary ul li::before { content: '•'; margin-right: 0.5rem; color: var(--accent); }
  .card-summary ul li { display: flex; align-items: baseline; }

  .card-url {
    display: inline-block;
    margin-top: 0.65rem;
    font-size: 0.75rem;
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }
  .card-url:hover { text-decoration: underline; }

  .skeleton .card-summary {
    background: linear-gradient(90deg, var(--shimmer-a) 25%, var(--shimmer-b) 50%, var(--shimmer-a) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
    height: 4.5rem;
    color: transparent;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .error-msg { color: var(--error); font-size: 0.85rem; font-style: italic; }
  #parse-error { color: var(--error); font-size: 0.8rem; margin-top: 0.4rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <h1>PitchMate</h1>
      <p class="subtitle">Paste your pitches, get radio-ready summaries.</p>
    </div>
    <button id="theme-toggle">☀️ Light</button>
  </div>

  <textarea id="input" placeholder="Penguin escapes Melbourne aquarium, found at tram stop
https://example.com/penguin

Competitive eater sets world record at local pie festival
https://example.com/pie-festival"></textarea>
  <div id="parse-error"></div>
  <button id="summarise-btn">Summarise</button>
  <div id="cards"></div>
</div>

<script>
// --- Theme toggle ---
const root = document.documentElement;
const themeBtn = document.getElementById('theme-toggle');

themeBtn.addEventListener('click', () => {
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  themeBtn.textContent = isDark ? '🌙 Dark' : '☀️ Light';
});

// --- Pitch parser ---
function parsePitches(text) {
  const blocks = text.trim().split(/\n{2,}/);
  const pairs = [];
  for (const block of blocks) {
    const lines = block.trim().split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) continue;
    const urlLine = lines.findIndex(l => /^https?:\/\//i.test(l));
    if (urlLine < 1) continue;
    pairs.push({ headline: lines.slice(0, urlLine).join(' '), url: lines[urlLine] });
  }
  return pairs;
}

// --- Render bullets ---
// Expects Claude to return lines starting with •
function renderSummary(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const bullets = lines.filter(l => l.startsWith('•')).map(l => l.slice(1).trim());
  if (bullets.length > 0) {
    return '<ul>' + bullets.map(b => `<li>${escHtml(b)}</li>`).join('') + '</ul>';
  }
  // Fallback: plain text if Claude didn't use bullets
  return escHtml(text);
}

function makeCard(headline, url, state) {
  const card = document.createElement('div');
  card.className = 'card' + (state === 'loading' ? ' skeleton' : '');
  card.innerHTML = `
    <div class="card-headline">${escHtml(headline)}</div>
    <div class="card-summary">${
      state === 'loading' ? '&nbsp;' :
      state === 'error'   ? '<span class="error-msg">Couldn\'t read — likely paywalled.</span>' :
      renderSummary(state)
    }</div>
    <a class="card-url" href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(url)}</a>
  `;
  return card;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// --- Summarise ---
document.getElementById('summarise-btn').addEventListener('click', async () => {
  const text = document.getElementById('input').value;
  const parseError = document.getElementById('parse-error');
  const pairs = parsePitches(text);

  if (pairs.length === 0) {
    parseError.textContent = 'No valid headline/URL pairs found. Make sure each pair is separated by a blank line.';
    return;
  }
  parseError.textContent = '';

  const btn = document.getElementById('summarise-btn');
  btn.disabled = true;
  btn.textContent = 'Working…';

  const container = document.getElementById('cards');
  container.innerHTML = '';

  const cardEls = pairs.map(({ headline, url }) => {
    const el = makeCard(headline, url, 'loading');
    container.appendChild(el);
    return el;
  });

  try {
    const res = await fetch('/summarise', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pairs }),
    });
    const data = await res.json();

    data.results.forEach(({ summary, error }, i) => {
      const el = cardEls[i];
      el.className = 'card';
      el.querySelector('.card-summary').innerHTML =
        error || !summary
          ? '<span class="error-msg">Couldn\'t read — likely paywalled.</span>'
          : renderSummary(summary);
    });
  } catch {
    cardEls.forEach(el => {
      el.className = 'card';
      el.querySelector('.card-summary').innerHTML = '<span class="error-msg">Request failed — check your connection.</span>';
    });
  }

  btn.disabled = false;
  btn.textContent = 'Summarise';
});
</script>
</body>
</html>
